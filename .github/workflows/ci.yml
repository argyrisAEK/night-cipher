name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check benchmark script syntax
        run: node --check scripts/blind-seeker-run.mjs && node --check scripts/blind-seeker-score.mjs
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        timeout-minutes: 15
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Playwright install attempt ${attempt}/2"
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Install failed; retrying once in 15 seconds..."
              sleep 15
            fi
          done
          echo "::error::Playwright installation failed after 2 attempts"
          exit 1
      - name: Browser regression tests
        run: npm test
      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-cipher-visual-audit
          path: test-results/visual-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload blind Seeker public dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-cipher-blind-seeker-public
          path: test-results/blind-seeker/public/
          if-no-files-found: warn
          retention-days: 14
