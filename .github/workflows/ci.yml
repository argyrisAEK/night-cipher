name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm test
      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-cipher-visual-audit
          path: test-results/visual-audit/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload blind Seeker public dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-cipher-blind-seeker-public
          path: test-results/blind-seeker/public/
          if-no-files-found: warn
          retention-days: 14
